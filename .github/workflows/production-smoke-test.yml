name: Production Smoke Test

# Run after every push to main (i.e., every Vercel production deploy)
# and daily at 08:00 UTC to catch silent regressions
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  smoke-test:
    name: Live site content check
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deploy
        if: github.event_name == 'push'
        run: |
          echo "Waiting 90s for Vercel to build and promote..."
          sleep 90

      - name: Fetch homepage (EN)
        id: fetch_en
        run: |
          BODY=$(curl -sL https://www.meyng.com/en)
          echo "$BODY" > /tmp/homepage_en.html
          echo "fetched=$(echo "$BODY" | wc -c) bytes"

      - name: Assert new hero headline present
        run: |
          if ! grep -qi "Building the Language Layer" /tmp/homepage_en.html; then
            echo "FAIL: Hero headline 'Building the Language Layer' not found"
            echo "First 500 chars of response:"
            head -c 500 /tmp/homepage_en.html
            exit 1
          fi
          echo "PASS: Hero headline present"

      - name: Assert SangoAI flagship section present
        run: |
          if ! grep -qi "SangoAI" /tmp/homepage_en.html; then
            echo "FAIL: SangoAI not found on homepage"
            exit 1
          fi
          echo "PASS: SangoAI present"

      - name: Assert ConnectZ absent
        run: |
          if grep -qi "ConnectZ" /tmp/homepage_en.html; then
            echo "FAIL: ConnectZ found on homepage — discontinued project must not appear"
            grep -i "ConnectZ" /tmp/homepage_en.html | head -5
            exit 1
          fi
          echo "PASS: ConnectZ absent"

      - name: Assert language roadmap present
        run: |
          if ! grep -qi "Lingala\|Wolof\|Bambara\|Kirundi\|roadmap\|Language Expansion" /tmp/homepage_en.html; then
            echo "FAIL: Language roadmap section missing"
            exit 1
          fi
          echo "PASS: Language roadmap present"

      - name: Assert stale/false claims absent
        run: |
          # LINGUA Africa 0020 (Aug 2026): this site claimed "581 entries with
          # native audio" for months — stale count AND a false feature claim —
          # while this smoke test ran green daily. Content checks must include
          # the claims a funder would fact-check, not only branding strings.
          # Word-ish boundaries on 581 avoid matching asset hashes.
          FAIL=0
          if grep -qi "native audio" /tmp/homepage_en.html; then
            echo "::error title=False claim live::'native audio' on meyng.com — recordings are unpublished pending consent"
            FAIL=1
          fi
          if grep -qiE '[^0-9A-Za-z_]581[^0-9A-Za-z_]' /tmp/homepage_en.html; then
            echo "::error title=Stale count live::'581' on meyng.com — counts must be non-numeric floor phrasing"
            FAIL=1
          fi
          if grep -qi "thousands of" /tmp/homepage_en.html; then
            echo "::error title=Inflated claim live::'thousands of' on meyng.com"
            FAIL=1
          fi
          [ $FAIL -eq 0 ] || exit 1
          echo "PASS: no stale or false claims"

      - name: OPSEC check — no infra names in public HTML
        run: |
          FAIL=0
          for term in "Lambda" "DynamoDB" "Bedrock" "Claude Sonnet" "claude-sonnet" "Next.js" "Vercel" "Flask" "Docker"; do
            if grep -q "$term" /tmp/homepage_en.html; then
              echo "OPSEC FAIL: '$term' found in public HTML"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            exit 1
          fi
          echo "PASS: OPSEC clean"

      - name: Lead channel — delivery is configured
        run: |
          # Aug 2026: the contact form POSTed to a dead provider endpoint and
          # returned 404 for an unknown period while this smoke test ran green
          # daily. The site rendered perfectly; the only lead channel was gone.
          # Uptime checks must cover the revenue path, not just the HTML.
          BODY=$(curl -sL https://www.meyng.com/api/contact)
          echo "$BODY"
          if ! echo "$BODY" | grep -q '"configured":true'; then
            echo "::error title=Lead channel down::CONTACT_FORM_ENDPOINT is unset in production — every contact form submission is being dropped"
            exit 1
          fi
          echo "PASS: contact delivery configured"

      - name: Lead channel — end-to-end delivery canary (weekly)
        # Config being present does not prove the provider accepts it — that was
        # exactly the Aug 2026 failure. Weekly, not daily, to stay inside the
        # provider's free-tier submission quota.
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "SKIP: delivery canary runs Mondays only (today is day $(date -u +%u))"
            exit 0
          fi
          PAYLOAD='{"name":"Smoke Test Canary","email":"contact@meyng.com","subject":"general","message":"Automated weekly delivery canary from GitHub Actions. No action needed."}'
          STATUS=$(curl -sL -o /tmp/canary.json -w "%{http_code}" -X POST https://www.meyng.com/api/contact -H "Content-Type: application/json" -d "$PAYLOAD")
          cat /tmp/canary.json
          if [ "$STATUS" != "200" ]; then
            echo "::error title=Lead channel broken::Canary submission returned $STATUS — leads are not reaching the inbox"
            exit 1
          fi
          echo "PASS: canary lead delivered end to end"

      - name: French version loads
        run: |
          STATUS=$(curl -sLo /dev/null -w "%{http_code}" https://www.meyng.com/fr)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: French version returned $STATUS"
            exit 1
          fi
          echo "PASS: French version 200 OK"

      - name: HTTP status check (bare domain redirect)
        run: |
          STATUS=$(curl -so /dev/null -w "%{http_code}" https://meyng.com)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "301" ] && [ "$STATUS" != "307" ]; then
            echo "FAIL: meyng.com returned $STATUS"
            exit 1
          fi
          echo "PASS: meyng.com HTTP $STATUS"
